# A-BACKEND-B-CI: the second backend (true-async fork, ADR-0003) is behind `cfg(php_async_abi)`,
# so nothing in ci.yml compiles it and nothing on a developer's box does either. It therefore
# stopped compiling silently — two `match` arms against nine `Outcome` variants — and on
# 2026-09-19 there was no checkout anywhere to read the fork's headers against, so an owner note
# about upstream had to be verified over the network instead.
#
# This is correctness, not performance, so it does not belong in nightly.yml (whose own header
# says correctness lives in ci.yml). It is not in ci.yml either, because building php-src takes
# minutes and this backend changes on the fork's schedule, not on ours. Scheduled, with
# workflow_dispatch so R-TA-CONTEXT and R-TA-REQUEST-SCOPE can get a checkout on demand.
name: backend-b

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: >-
          Fork branch to build. Three names are in play and which one is right is R-TA-REQUEST-SCOPE's
          finding: async-core (what scripts/build-php-async.sh defaults to, PR #22561 head),
          PHP-8.6-true-async, and whatever revision php-async's CHANGELOG #105 requires.
        required: false
        default: async-core

env:
  CARGO_TERM_COLOR: always
  ASYNC_BRANCH: ${{ github.event.inputs.branch || 'async-core' }}
  ASYNC_PREFIX: /opt/php86-async-zts

jobs:
  build:
    name: backend (b) compiles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The prefix is the expensive half (a php-src build), and it only changes when the fork
      # does. Keyed on the branch so a dispatch with a different one does not silently reuse it.
      - name: Cache the built fork
        id: fork
        uses: actions/cache@v4
        with:
          path: ${{ env.ASYNC_PREFIX }}
          key: php-async-${{ env.ASYNC_BRANCH }}-${{ hashFiles('scripts/build-php-async.sh', 'patches/*.patch') }}

      - name: Build the true-async fork
        run: PREFIX="$ASYNC_PREFIX" timeout 3600 scripts/build-php-async.sh

      # The header this whole backend is written against. If it is absent the build script did
      # something other than what it claims, and every later step would report a confusing error.
      - name: The async ABI header is where ADR-0003 says it is
        run: test -f "$ASYNC_PREFIX/include/php/Zend/zend_async_API.h"

      # backend/async_core.rs links against this symbol, and it exists only because
      # patches/0001-test-scheduler-idle-hook.patch adds it to the fork's reference scheduler. The
      # first two scheduled runs (2026-09-21, 2026-09-22) built the fork unpatched and failed at
      # link time, after check and clippy had passed — neither of those links.
      - name: The idle hook the backend links against is exported
        run: nm -D --defined-only "$ASYNC_PREFIX/lib/libphp.so" | grep -qw test_scheduler_set_idle_hook

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The unit suite needs a process per test; ci.yml installs nextest the same way.
      - uses: taiki-e/install-action@nextest

      # Compiling is the floor, not the gate: a file can compile and still be wrong. clippy with
      # the same -D warnings ci.yml uses is what actually caught the last breakage in feature-gated
      # code (2026-09-19, backend/temporal.rs), so it runs here too.
      - name: cargo check
        run: |
          PHP_CONFIG="$ASYNC_PREFIX/bin/php-config" CARGO_TARGET_DIR=target-async \
            cargo check --workspace --all-targets --locked

      - name: clippy
        run: |
          PHP_CONFIG="$ASYNC_PREFIX/bin/php-config" CARGO_TARGET_DIR=target-async \
            cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build --release
        run: |
          PHP_CONFIG="$ASYNC_PREFIX/bin/php-config" CARGO_TARGET_DIR=target-async \
            cargo build --release -p ignis

      # V-8 measured E1 on engine coroutines through this backend. Running the unit suite is not
      # that, and does not claim to be — it is the cheapest proof that the binary this job just
      # built is a working one rather than merely a linked one.
      # nextest, not `cargo test`: these tests need a process each. Plain `cargo test` runs them
      # in threads of one process and twelve fail on shared state — measured on the ordinary ZTS
      # build too, so this was never about the fork. This job had not run once since it was added
      # (2026-09-20, A-BACKEND-B-CI), so the step had never been exercised; ci.yml has always used
      # nextest and that is why nobody noticed.
      - name: unit tests against the fork (nextest — these need a process each)
        run: |
          PHP_CONFIG="$ASYNC_PREFIX/bin/php-config" CARGO_TARGET_DIR=target-async \
          LD_LIBRARY_PATH="$ASYNC_PREFIX/lib" cargo nextest run --workspace --locked

      # R-TA-CONTEXT and R-TA-REQUEST-SCOPE both need to read the fork's headers. Publishing them
      # means the next person answering those does it against a revision this job names, instead
      # of fetching from the network and guessing which branch they got.
      - name: Publish the ABI headers the R-TA research reads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zend-async-headers-${{ env.ASYNC_BRANCH }}
          path: ${{ env.ASYNC_PREFIX }}/include/php/Zend/zend_async_*.h
          if-no-files-found: warn
