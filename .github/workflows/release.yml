# Cuts a GitHub release from a `vX.Y.Z` tag: builds and pushes the runtime image
# (same Dockerfile and smoke check as image.yml), proves `--version` matches the tag,
# packages the binary + libphp.so, and publishes the release with notes since the
# previous tag. workflow_dispatch with a `tag` input lets the owner dry-run the whole
# thing against the current HEAD before pushing a real tag (the session git proxy
# refuses tag pushes — see scripts/release.sh and commit 8ffd758).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.0.2-rc.1 (dry run: HEAD's Cargo.toml version must match it)"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve tag and version
        id: v
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "tag must start with v (got: $tag)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/koekaverna/ignis:${{ steps.v.outputs.tag }}
          cache-from: type=gha,scope=ignis-runtime
          cache-to: type=gha,scope=ignis-runtime,mode=max

      # Same acceptance image.yml runs on every push to main, against the tagged image.
      - name: smoke the tagged image
        run: |
          docker run -d --name ignis ghcr.io/koekaverna/ignis:${{ steps.v.outputs.tag }}
          for _ in $(seq 1 40); do
            docker exec ignis bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /_ignis/health HTTP/1.0\r\n\r\n" >&3; cat <&3' 2>/dev/null | grep -q '"status":"ok"' && ok=1 && break
            sleep 0.5
          done
          docker logs ignis
          [ "${ok:-0}" = 1 ] || { echo "image never answered /_ignis/health"; exit 1; }
          docker exec ignis ldd /usr/local/bin/ignis | grep -E "not found" && exit 1
          echo "image serves and links only what it carries"
          docker rm -f ignis

      # M5-1: this is how the tag and Cargo.toml version are kept honest — a tag whose
      # version wasn't bumped in the same commit (scripts/release.sh) fails the release.
      - name: tag must match ignis --version
        run: |
          actual="$(docker run --rm ghcr.io/koekaverna/ignis:${{ steps.v.outputs.tag }} --version)"
          expected="ignis ${{ steps.v.outputs.version }}"
          echo "actual:   $actual"
          echo "expected: $expected"
          [ "$actual" = "$expected" ] || { echo "tag ${{ steps.v.outputs.tag }} does not match $actual — bump crates/ignis/Cargo.toml (scripts/release.sh) and retag"; exit 1; }

      - name: extract runtime binaries
        run: |
          dir="ignis-${{ steps.v.outputs.tag }}-linux-x86_64"
          mkdir -p "/tmp/release/$dir"
          cid=$(docker create ghcr.io/koekaverna/ignis:${{ steps.v.outputs.tag }})
          docker cp "$cid:/usr/local/bin/ignis" "/tmp/release/$dir/ignis"
          docker cp "$cid:/opt/php85-zts/lib/libphp.so" "/tmp/release/$dir/libphp.so"
          docker rm "$cid"
          cat > "/tmp/release/$dir/README.txt" <<'EOF'
          ignis runtime binary + libphp.so, extracted from the ghcr.io/koekaverna/ignis
          release image (docker/Dockerfile).

          Layout expected at runtime:
            ./ignis                       -> anywhere on PATH
            /opt/php85-zts/lib/libphp.so   -> same path compiled into ignis's rpath
                                              (crates/ignis-sys/build.rs); no LD_LIBRARY_PATH needed
                                              if libphp.so is placed there, otherwise set
                                              LD_LIBRARY_PATH to wherever you put it.

          The host must also provide these six runtime libraries (Ubuntu/Debian package
          names below; find the equivalent on other distros) — everything libphp.so needs
          beyond libc, per docker/Dockerfile:
            libssl3t64      OpenSSL
            libsqlite3-0    SQLite3
            libcurl4t64     curl
            libonig5        Oniguruma (mbstring)
            libpq5          libpq (Postgres client)
            zlib1g          zlib

          Also needs ca-certificates for TLS verification (outbound https/ssl:// streams).

          You also need the PHP userland tree (php/ and examples/ from the repo) and an
          ignis.toml — see docker/ignis.toml and docs/operate.md.
          EOF
          tar -C /tmp/release -czf "$dir.tar.gz" "$dir"
          mv "/tmp/release/$dir.tar.gz" .

      - name: release notes since previous tag
        id: notes
        run: |
          git fetch --tags --force
          prev="$(git tag --sort=-v:refname | grep -v "^${{ steps.v.outputs.tag }}$" | head -1 || true)"
          range_end="HEAD"
          git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null && range_end="${{ steps.v.outputs.tag }}"
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              echo "Commits since $prev:"
              echo
              echo '```'
              git log --oneline "$prev..$range_end"
              echo '```'
            else
              echo "Initial release."
            fi
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(steps.v.outputs.tag, '-') }}
          files: ignis-${{ steps.v.outputs.tag }}-linux-x86_64.tar.gz
