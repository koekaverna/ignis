# Builds and pushes ghcr.io/koekaverna/ignis (the runtime image, M2 "Install") on every push to main.
# The PHP builder image it starts from is built separately and only when its inputs change
# (php-image.yml); this one is cheap because that heavy layer is cached on GHCR.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/koekaverna/ignis:latest
            ghcr.io/koekaverna/ignis:${{ github.sha }}
          cache-from: type=gha,scope=ignis-runtime
          cache-to: type=gha,scope=ignis-runtime,mode=max
      # The acceptance for M2, run on the image just pushed: it must answer /_ignis/health with
      # nothing but the image, and its binary must not depend on a PHP install outside it.
      - name: smoke the pushed image
        run: |
          docker run -d --name ignis ghcr.io/koekaverna/ignis:${{ github.sha }}
          for _ in $(seq 1 40); do
            docker exec ignis bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /_ignis/health HTTP/1.0\r\n\r\n" >&3; cat <&3' 2>/dev/null | grep -q '"status":"ok"' && ok=1 && break
            sleep 0.5
          done
          docker logs ignis
          [ "${ok:-0}" = 1 ] || { echo "image never answered /_ignis/health"; exit 1; }
          docker exec ignis ldd /usr/local/bin/ignis | grep -E "not found" && exit 1
          echo "image serves and links only what it carries"
