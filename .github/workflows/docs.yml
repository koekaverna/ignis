# Builds the documentation site (mkdocs-material) and publishes it to GitHub Pages.
# Independent of ci.yml/image.yml: docs-only paths, own job, no shared runner state.
name: docs
on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
