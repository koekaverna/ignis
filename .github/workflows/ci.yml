# Correctness and compat suites run here (owner rule 2026-09-16); local runs are for VALIDATION numbers and perf.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
# H-4 (2026-09-16): with cancel-in-progress unconditional, the orchestrator's push-every-few-minutes
# cadence on main meant three runs in a row were cancelled and the full gate never completed
# (run 35115588266 and its successors were all on main; `gh run list` at the time showed only
# cancelled/superseded runs there). Pull requests still get superseded on every push
# (cheap, no gate to protect); main never does, so every push to main gets one completed run of
# the full gate — later pushes queue behind the one in flight instead of killing it. Chose this
# over a workflow_dispatch "full_gate" opt-out because that still lets an ordinary push to main
# get silently cancelled; this makes the safe behavior the default instead of something you must
# remember to ask for. Cost: pushes to main faster than a full run (about 10 minutes on
# 2026-09-16) queue behind each other instead of collapsing, so a burst leaves several gates
# queued — acceptable because the alternative (silent cancellation) is exactly the bug, and
# docs/orchestration.md's "push per batch" cadence keeps bursts rare.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# A container job's default shell is `sh -e`, which has no pipefail: every `… | tee /tmp/x.log`
# step below answered with tee's status, so a failing smoke or nextest could not turn a job red
# (2026-09-23: the first nts smoke leg printed "PHP not built" and passed in 0 s). bash here is
# `bash -eo pipefail`, so the piped command's own status is the step's.
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  PHP_CONFIG: /opt/php85-zts/bin/php-config
  LD_LIBRARY_PATH: /opt/php85-zts/lib
jobs:
  # Owner (2026-09-23): checks run only for what changed. Three buckets, coarse on purpose: a
  # Rust change runs the Rust jobs and everything that executes the binary; a PHP change runs the
  # PHP jobs and the same; a change to scripts or benches runs only the jobs that execute them.
  # workflow_dispatch has no diff and runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
      php: ${{ steps.filter.outputs.php == 'true' || github.event_name == 'workflow_dispatch' }}
      runtime: ${{ steps.filter.outputs.runtime == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"
              - ".github/workflows/ci.yml"
            php:
              - "php/**"
              - "examples/**"
              - "bench/php/**"
              - "bench/e22/**"
              - ".github/workflows/ci.yml"
            runtime:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "php/**"
              - "examples/**"
              - "bench/**"
              - "scripts/**"
              - ".github/workflows/ci.yml"
  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than @stable: with `-D warnings` blocking, a six-week Rust release can turn
      # main red with no commit to blame. Pinning here rather than in a rust-toolchain.toml keeps it
      # to this one job instead of making all seven fetch a second toolchain (ADR-0041 section 7).
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      # Cheapest first: a formatting mistake should cost ten seconds, not four minutes.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # crates/ignis/Cargo.toml documents this as the off build for the H35 overhead bench, and it
      # had silently stopped compiling.
      - name: the off build still compiles
        run: cargo check --workspace --no-default-features --locked
      - uses: taiki-e/install-action@cargo-deny
      - name: deny (advisories, licences, sources)
        run: cargo deny check

  unit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: nextest + miri (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [zts, nts]
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # S-NTS-MODE: the nts leg is a separate prefix and target dir (CLAUDE.md). PHP_CONFIG/
    # CARGO_TARGET_DIR are overridden here at job level; LD_LIBRARY_PATH is left at the workflow's
    # zts default and unset per step instead, so the binary's own RUNPATH does the work.
    env:
      PHP_CONFIG: ${{ matrix.engine == 'nts' && '/opt/php85-nts/bin/php-config' || '/opt/php85-zts/bin/php-config' }}
      CARGO_TARGET_DIR: ${{ matrix.engine == 'nts' && 'target-nts' || 'target' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.engine == 'zts'
        with:
          components: miri
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: unit-${{ matrix.engine }}
      - name: nextest
        # Both prefixes install a same-soname libphp.so and LD_LIBRARY_PATH beats RUNPATH, so the
        # workflow's zts LD_LIBRARY_PATH would make an nts-built test binary load the wrong libphp
        # and die in the loader (V-113); unset per step.
        run: |
          if [ "${{ matrix.engine }}" = "nts" ]; then
            env -u LD_LIBRARY_PATH timeout 900 cargo +stable nextest run --workspace 2>&1 | tee /tmp/nextest.log
          else
            timeout 900 cargo +stable nextest run --workspace 2>&1 | tee /tmp/nextest.log
          fi
      - name: miri (zval + module helpers)
        if: matrix.engine == 'zts'
        run: |
          cargo +nightly miri setup
          timeout 1200 cargo +nightly miri test -p ignis -- php::zval php::module 2>&1 | tee /tmp/miri.log
      # Reported, not gated (ADR-0041 section 6). bindings.rs is 17,944 lines and ~244 instrumentable
      # functions no test calls, so leaving it in the denominator would make the number meaningless.
      # zts only: coverage is one number for the engine we ship (docker/php.Dockerfile builds pcov
      # against zts), and running it twice would only cost time for a second copy of the same claim.
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: matrix.engine == 'zts'
      - name: coverage
        if: matrix.engine == 'zts'
        run: |
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex '(bindings\.rs|/build\.rs|/rustc/)'
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(bindings\.rs|/build\.rs|/rustc/)' | tee /tmp/coverage.txt
      - uses: actions/upload-artifact@v4
        if: matrix.engine == 'zts'
        with:
          name: coverage
          path: |
            lcov.info
            /tmp/coverage.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-logs-${{ matrix.engine }}
          path: /tmp/*.log

  smoke:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: scripts/smoke.sh (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [zts, nts]
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # S-NTS-MODE: see the `unit` job above for why PHP_CONFIG/CARGO_TARGET_DIR are overridden here
    # and LD_LIBRARY_PATH is unset per step instead.
    env:
      PHP_CONFIG: ${{ matrix.engine == 'nts' && '/opt/php85-nts/bin/php-config' || '/opt/php85-zts/bin/php-config' }}
      CARGO_TARGET_DIR: ${{ matrix.engine == 'nts' && 'target-nts' || 'target' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.engine }}
      # Both of these used to end in `|| echo`, and smoke.sh then printed "skipped" into a green
      # run -- which is why the PHP unit suite had never actually executed in CI. They fail hard now.
      # --prefer-source stays for revolt only: its DriverTest needs vendor/revolt/event-loop/test/,
      # which the dist archive does not carry. Composer itself always runs on the zts php: it only
      # resolves the vendor tree, and that has nothing to do with which engine ABI smoke.sh then
      # exercises.
      - uses: actions/cache@v4
        with:
          path: php/packages/revolt/vendor
          key: revolt-vendor-${{ hashFiles('php/packages/revolt/composer.json', 'php/packages/revolt/composer.lock') }}
      - name: composer install (E7 Revolt/AMPHP examples)
        run: cd php/packages/revolt && timeout 600 /opt/php85-zts/bin/php "$(command -v composer)" install --prefer-source --no-interaction --quiet
      - name: composer install (the php/ monorepo and its dev tooling)
        run: cd php && timeout 900 /opt/php85-zts/bin/php "$(command -v composer)" install --no-interaction --quiet
      - name: smoke (every step under timeout)
        # BIN/IGNIS_ENGINE tell smoke.sh which engine to smoke; it builds that engine's binary
        # itself. nts additionally needs LD_LIBRARY_PATH unset so the binary's own RUNPATH resolves
        # libphp instead of the workflow's zts LD_LIBRARY_PATH (V-113).
        run: |
          if [ "${{ matrix.engine }}" = "nts" ]; then
            env -u LD_LIBRARY_PATH BIN=./target-nts/release/ignis IGNIS_ENGINE=nts \
              timeout 2400 scripts/smoke.sh 2>&1 | tee /tmp/smoke.log
          else
            timeout 2400 scripts/smoke.sh 2>&1 | tee /tmp/smoke.log
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs-${{ matrix.engine }}
          path: |
            /tmp/*.log
            bench/results/

  php-lint:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    name: php -l + phpstan + cs-fixer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: composer install
        run: cd php && timeout 900 /opt/php85-zts/bin/php "$(command -v composer)" install --no-interaction --no-progress
      # Everything runs under the 8.5.10 ZTS build, the engine this code actually runs on. The
      # vendor tree is resolved for that version, so symfony/console in it is 8.4+ syntax and the
      # image's stock 8.3.6 cannot even parse it -- a vendor/bin tool run there dies in
      # symfony/console, not in our code.
      # `find`, not `git ls-files` -- the latter fails in a container with "dubious ownership".
      - name: php -l (every tracked PHP file, on the production engine)
        run: |
          find php/packages php/tests examples bench/php bench/e22 -name '*.php' \
               -not -path '*/vendor/*' -not -path '*/var/cache/*' -print0 \
            | xargs -0 -n1 -P4 /opt/php85-zts/bin/php -l > /dev/null
      # One command, and the same one `composer check` runs locally: both configs (the tree at level 9
      # and the 8.1 floor revolt promises AMPHP users) and the memory limit live in php/composer.json.
      # Before this the job ran phpstan directly and inherited the container php.ini's 128M, which a
      # parallel worker reached on 2026-09-18 and crashed the gate -- a limit only a developer's own
      # php.ini supplies is a gate that cannot be reproduced off CI. Cost: no `--error-format=github`,
      # so failures are read from the log rather than as inline annotations.
      - name: phpstan (both configs, through the composer script)
        run: cd php && /opt/php85-zts/bin/php "$(command -v composer)" run-script stan
      - name: php-cs-fixer (check only)
        run: cd php && /opt/php85-zts/bin/php vendor/bin/php-cs-fixer check --diff --show-progress=none

  php-unit:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    name: phpunit + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: composer install
        run: cd php && timeout 900 /opt/php85-zts/bin/php "$(command -v composer)" install --no-interaction --no-progress
      # Twice on purpose: once through phpunit.xml (which needs ext-dom, so this also proves the
      # config is honoured) and once through scripts/test-php.sh with pcov, which is where the
      # coverage number comes from.
      - name: phpunit (through phpunit.xml)
        run: cd php && /opt/php85-zts/bin/php vendor/bin/phpunit --colors=never
      - name: phpunit + line coverage (PHP 8.5.10 ZTS + pcov)
        run: timeout 900 scripts/test-php.sh --coverage 2>&1 | tee /tmp/php-coverage.log
      - name: coverage floor
        run: scripts/ci-coverage-gate.sh /tmp/php-coverage.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: php-unit-logs
          path: /tmp/*.log

  e9-temporal:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: "E9/E20 temporal: official sdk-php on sdk-core, conformance, live run, replay + negative control"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Same pin and the same reason as the `lint` job, plus clippy: this job carries the
      # --all-features clippy run, and @stable ships without the component.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: temporal
      # GitHub service containers cannot take a command, and the dev server needs `server start-dev`;
      # the bench script starts it itself from $TEMPORAL.
      - name: temporal CLI
        run: |
          # --retry: temporal.download reset the connection on run 35137661859 and turned `main` red
          # for a reason that had nothing to do with the commit.
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 "https://temporal.download/cli/archive/latest?platform=linux&arch=amd64" -o /tmp/temporal.tar.gz
          tar -xzf /tmp/temporal.tar.gz -C /usr/local/bin temporal && temporal --version
      # backend/temporal.rs and completion_json.rs are linted nowhere else: --all-features needs
      # protoc, which only this image has, and only this job already caches the sdk-core graph.
      - name: clippy with every feature
        run: timeout 1800 cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The three completion_json tests are gated on `feature = "temporal"`, so the default nextest
      # run in the unit job has never executed them.
      - name: nextest with every feature
        run: timeout 900 cargo nextest run --workspace --all-features
      - name: build with the temporal feature
        run: timeout 2400 cargo build --release -p ignis --features temporal
      # temporal/sdk pulls grpc/grpc, which declares ext-grpc; only the pure-PHP client half is
      # used here (V-66), so the platform requirement is ignored on purpose.
      - name: sdk-php (composer on the image's system php)
        run: (cd php/packages/temporal-core-transport && timeout 900 composer install --ignore-platform-reqs --no-interaction --prefer-source --quiet)
      - name: E20 conformance, under the ignis binary and under stock PHP
        run: |
          timeout 600 bench/e20-sdkphp.sh 2>&1 | tee /tmp/e20.log
          grep -q "E20: GREEN" /tmp/e20.log
      - name: E9 live workflow + replay + mutated replay must fail
        run: |
          TEMPORAL=/usr/local/bin/temporal timeout 300 bench/e9-temporal.sh 2>&1 | tee /tmp/e9.log
          grep -q "REPLAY_OK" /tmp/e9.log && grep -q "REPLAY_FAILED" /tmp/e9.log && grep -q "Status.*COMPLETED" /tmp/e9.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e9-logs
          path: /tmp/*.log

  e15:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: E15 ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [phpt, revolt, frankenphp]
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: timeout 1800 cargo build --release -p ignis
      # The ported suite scripts were written on a box where the repo lives at /home/user/ignis.
      - name: path compatibility
        run: mkdir -p /home/user /home/user/cmp && ln -sfn "$GITHUB_WORKSPACE" /home/user/ignis
      - name: php-src phpt suites (fibers, streams, sockets) in stock / main / fiber mode
        if: matrix.suite == 'phpt'
        run: |
          timeout 2400 bench/e15-phpt.sh 2>&1 | tee /tmp/e15-phpt.log
          scripts/ci-gate.sh phpt /tmp/e15-phpt.log
      - uses: actions/cache@v4
        if: matrix.suite == 'revolt'
        with:
          path: php/packages/revolt/vendor
          key: revolt-vendor-${{ hashFiles('php/packages/revolt/composer.json', 'php/packages/revolt/composer.lock') }}
      - name: Revolt DriverTest on IgnisDriver
        if: matrix.suite == 'revolt'
        run: |
          (cd php/packages/revolt && timeout 600 /opt/php85-zts/bin/php "$(command -v composer)" install --prefer-source --no-interaction --quiet)
          timeout 900 bench/e15-revolt.sh 2>&1 | tee /tmp/e15-revolt.log
          scripts/ci-gate.sh revolt /tmp/e15-revolt.log
      - name: FrankenPHP testdata through the classic-mode adapter
        if: matrix.suite == 'frankenphp'
        run: |
          git clone -q --depth 1 https://github.com/php/frankenphp /home/user/frankenphp
          timeout 900 bench/e15-frankenphp.sh 2>&1 | tee /tmp/e15-frankenphp.log
          scripts/ci-gate.sh frankenphp /tmp/e15-frankenphp.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e15-${{ matrix.suite }}-logs
          path: |
            /tmp/*.log
            bench/results/
