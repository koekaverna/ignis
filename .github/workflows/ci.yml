# Correctness and compat suites run here (owner rule 2026-09-16); local runs are for VALIDATION numbers and perf.
name: ci
on:
  push:
    branches: [main, "night-*"]
  pull_request:
  workflow_dispatch:
# H-4 (2026-09-16): with cancel-in-progress unconditional, the orchestrator's push-every-few-minutes
# cadence on main meant three runs in a row were cancelled and the full gate never completed
# (run 35115588266 and its successors were all on main; `gh run list` at the time showed only
# cancelled/superseded runs there). PRs and night-* branches still get superseded on every push
# (cheap, no gate to protect); main never does, so every push to main gets one completed run of
# the full gate — later pushes queue behind the one in flight instead of killing it. Chose this
# over a workflow_dispatch "full_gate" opt-out because that still lets an ordinary push to main
# get silently cancelled; this makes the safe behavior the default instead of something you must
# remember to ask for. Cost: pushes to main faster than a full run (about 10 minutes on
# 2026-09-16) queue behind each other instead of collapsing, so a burst leaves several gates
# queued — acceptable because the alternative (silent cancellation) is exactly the bug, and
# docs/orchestration.md's "push per batch" cadence keeps bursts rare.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  PHP_CONFIG: /opt/php85-zts/bin/php-config
  LD_LIBRARY_PATH: /opt/php85-zts/lib
jobs:
  lint:
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than @stable: with `-D warnings` blocking, a six-week Rust release can turn
      # main red with no commit to blame. Pinning here rather than in a rust-toolchain.toml keeps it
      # to this one job instead of making all seven fetch a second toolchain (ADR-0041 section 7).
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      # Cheapest first: a formatting mistake should cost ten seconds, not four minutes.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # crates/ignis/Cargo.toml documents this as the off build for the H35 overhead bench, and it
      # had silently stopped compiling.
      - name: the off build still compiles
        run: cargo check --workspace --no-default-features --locked
      - uses: taiki-e/install-action@cargo-deny
      - name: deny (advisories, licences, sources)
        run: cargo deny check

  unit:
    name: nextest + miri
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: nextest
        run: timeout 900 cargo +stable nextest run --workspace 2>&1 | tee /tmp/nextest.log
      - name: miri (zval + module helpers)
        run: |
          cargo +nightly miri setup
          timeout 1200 cargo +nightly miri test -p ignis -- php::zval php::module 2>&1 | tee /tmp/miri.log
      # Reported, not gated (ADR-0041 section 6). bindings.rs is 17,944 lines and ~244 instrumentable
      # functions no test calls, so leaving it in the denominator would make the number meaningless.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage
        run: |
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex '(bindings\.rs|/build\.rs|/rustc/)'
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(bindings\.rs|/build\.rs|/rustc/)' | tee /tmp/coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            /tmp/coverage.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-logs
          path: /tmp/*.log

  smoke:
    name: scripts/smoke.sh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ignis
          POSTGRES_PASSWORD: ignis
          POSTGRES_DB: ignis
        options: >-
          --health-cmd "pg_isready -U ignis" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # Both of these used to end in `|| echo`, and smoke.sh then printed "skipped" into a green
      # run -- which is why the PHP unit suite had never actually executed in CI. They fail hard now.
      # --prefer-source stays for revolt only: its DriverTest needs vendor/revolt/event-loop/test/,
      # which the dist archive does not carry.
      - name: composer install (E7 Revolt/AMPHP examples)
        run: cd php/packages/revolt && timeout 600 /opt/php85-zts/bin/php "$(command -v composer)" install --prefer-source --no-interaction --quiet
      - name: composer install (the php/ monorepo and its dev tooling)
        run: cd php && timeout 900 /opt/php85-zts/bin/php "$(command -v composer)" install --no-interaction --quiet
      - name: smoke (every step under timeout)
        run: PGHOST=postgres timeout 2400 scripts/smoke.sh 2>&1 | tee /tmp/smoke.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: |
            /tmp/*.log
            bench/results/

  php-lint:
    name: php -l + phpstan + cs-fixer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: composer install
        run: cd php && timeout 900 /opt/php85-zts/bin/php "$(command -v composer)" install --no-interaction --no-progress
      # Everything runs under the 8.5.10 ZTS build, the engine this code actually runs on. The
      # vendor tree is resolved for that version, so symfony/console in it is 8.4+ syntax and the
      # image's stock 8.3.6 cannot even parse it -- a vendor/bin tool run there dies in
      # symfony/console, not in our code.
      # `find`, not `git ls-files` -- the latter fails in a container with "dubious ownership".
      - name: php -l (every tracked PHP file, on the production engine)
        run: |
          find php/packages php/tests examples bench/php bench/e22 -name '*.php' \
               -not -path '*/vendor/*' -not -path '*/var/cache/*' -print0 \
            | xargs -0 -n1 -P4 /opt/php85-zts/bin/php -l > /dev/null
      - name: phpstan
        run: cd php && /opt/php85-zts/bin/php vendor/bin/phpstan analyse --no-progress --error-format=github
      # revolt promises php 8.1 to AMPHP users, so it is analysed against that floor, not the tree's.
      - name: phpstan (revolt, the 8.1 floor)
        run: cd php && /opt/php85-zts/bin/php vendor/bin/phpstan analyse -c packages/revolt/phpstan.neon --no-progress --error-format=github
      - name: php-cs-fixer (check only)
        run: cd php && /opt/php85-zts/bin/php vendor/bin/php-cs-fixer check --diff --show-progress=none

  php-unit:
    name: phpunit + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: composer install
        run: cd php && timeout 900 /opt/php85-zts/bin/php "$(command -v composer)" install --no-interaction --no-progress
      # Twice on purpose: once through phpunit.xml (which needs ext-dom, so this also proves the
      # config is honoured) and once through scripts/test-php.sh with pcov, which is where the
      # coverage number comes from.
      - name: phpunit (through phpunit.xml)
        run: cd php && /opt/php85-zts/bin/php vendor/bin/phpunit --colors=never
      - name: phpunit + line coverage (PHP 8.5.10 ZTS + pcov)
        run: timeout 900 scripts/test-php.sh --coverage 2>&1 | tee /tmp/php-coverage.log
      - name: coverage floor
        run: scripts/ci-coverage-gate.sh /tmp/php-coverage.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: php-unit-logs
          path: /tmp/*.log

  e9-temporal:
    name: E9 temporal (sdk-core in-process, replay + negative control)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: temporal
      # GitHub service containers cannot take a command, and the dev server needs `server start-dev`;
      # the bench script starts it itself from $TEMPORAL.
      - name: temporal CLI
        run: |
          # --retry: temporal.download reset the connection on run 35137661859 and turned `main` red
          # for a reason that had nothing to do with the commit.
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 "https://temporal.download/cli/archive/latest?platform=linux&arch=amd64" -o /tmp/temporal.tar.gz
          tar -xzf /tmp/temporal.tar.gz -C /usr/local/bin temporal && temporal --version
      # backend/temporal.rs and completion_json.rs are linted nowhere else: --all-features needs
      # protoc, which only this image has, and only this job already caches the sdk-core graph.
      - name: clippy with every feature
        run: timeout 1800 cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The three completion_json tests are gated on `feature = "temporal"`, so the default nextest
      # run in the unit job has never executed them.
      - name: nextest with every feature
        run: timeout 900 cargo nextest run --workspace --all-features
      - name: build with the temporal feature
        run: timeout 2400 cargo build --release -p ignis --features temporal
      - name: live workflow + replay + mutated replay must fail
        run: |
          TEMPORAL=/usr/local/bin/temporal timeout 300 bench/e9-temporal.sh 2>&1 | tee /tmp/e9.log
          grep -q "REPLAY_OK" /tmp/e9.log && grep -q "REPLAY_FAILED" /tmp/e9.log && grep -q "Status.*COMPLETED" /tmp/e9.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e9-logs
          path: /tmp/*.log

  e15:
    name: E15 ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [phpt, revolt, swoole, frankenphp]
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: timeout 1800 cargo build --release -p ignis
      # The ported suite scripts were written on a box where the repo lives at /home/user/ignis.
      - name: path compatibility
        run: mkdir -p /home/user /home/user/cmp && ln -sfn "$GITHUB_WORKSPACE" /home/user/ignis
      - name: php-src phpt suites (fibers, streams, sockets) in stock / main / fiber mode
        if: matrix.suite == 'phpt'
        run: |
          timeout 2400 bench/e15-phpt.sh 2>&1 | tee /tmp/e15-phpt.log
          scripts/ci-gate.sh phpt /tmp/e15-phpt.log
      - name: Revolt DriverTest on IgnisDriver
        if: matrix.suite == 'revolt'
        run: |
          (cd php/packages/revolt && timeout 600 /opt/php85-zts/bin/php "$(command -v composer)" install --prefer-source --no-interaction --quiet)
          timeout 900 bench/e15-revolt.sh 2>&1 | tee /tmp/e15-revolt.log
          scripts/ci-gate.sh revolt /tmp/e15-revolt.log
      - name: Swoole swoole_runtime through the shim
        if: matrix.suite == 'swoole'
        run: |
          git clone -q --depth 1 https://github.com/swoole/swoole-src /home/user/cmp/swoole-src
          timeout 1800 bench/e15-swoole.sh --all 2>&1 | tee /tmp/e15-swoole.log
          scripts/ci-gate.sh swoole /tmp/e15-swoole.log
      - name: FrankenPHP testdata through the classic-mode adapter
        if: matrix.suite == 'frankenphp'
        run: |
          git clone -q --depth 1 https://github.com/php/frankenphp /home/user/frankenphp
          timeout 900 bench/e15-frankenphp.sh 2>&1 | tee /tmp/e15-frankenphp.log
          scripts/ci-gate.sh frankenphp /tmp/e15-frankenphp.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e15-${{ matrix.suite }}-logs
          path: |
            /tmp/*.log
            bench/results/
            /tmp/swoole-e15/results.tsv
