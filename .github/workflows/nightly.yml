# M5-4: nightly perf gate. Schedule + workflow_dispatch only — never on push (this is a load test,
# not a correctness gate; correctness lives in ci.yml).
name: nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
# Explicit on purpose: inside a `container:` job the runner defaults to `sh -e`, and the image's
# `sh` is dash, which rejects `set -o pipefail`. The first six scheduled runs (2026-09-17 to
# 2026-09-22) all died on that line before a single bench ran.
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  PHP_CONFIG: /opt/php85-zts/bin/php-config
  LD_LIBRARY_PATH: /opt/php85-zts/lib
  IGNIS_LISTEN: 127.0.0.1:8080
jobs:
  bench:
    name: nightly benches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/koekaverna/ignis-php:8.5.10-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      failed: ${{ steps.gate.outputs.failed }}
      table: ${{ steps.gate.outputs.table }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (release)
        run: timeout 900 cargo build --release -q -p ignis
      - name: E1 / E2 / hello / E16 / B1 p99, gated against VALIDATION thresholds
        id: gate
        run: |
          # +e on purpose: the shell above runs with -e, and a bench that dies must become a FAIL
          # row in the table, not an aborted job with no table at all.
          set +e -uo pipefail
          T="timeout 120"
          FAILED=0
          TABLE=""

          # dir=lt (default): value < threshold -> PASS (wall/overhead/latency numbers, lower is
          # better). dir=gt: value >= threshold -> PASS (throughput, higher is better — hello_rps'
          # "not below 50% of baseline"). Every gated number goes through this so the output shape
          # (docs/orchestration.md's "numbers or it didn't happen", one line per number) is uniform.
          record() { # name value threshold [dir=lt|gt]
            local name="$1" value="$2" threshold="$3" dir="${4:-lt}" pass
            pass=$(awk -v v="$value" -v t="$threshold" -v d="$dir" \
              'BEGIN{ok = (d=="gt") ? (v+0 >= t+0) : (v+0 < t+0); print ok ? "PASS" : "FAIL"}')
            local line="nightly: $name value=$value threshold=$threshold $pass"
            echo "$line"
            TABLE="${TABLE}${line}"$'\n'
            [ "$pass" = FAIL ] && FAILED=1
          }
          # wrk's "99%"/latency values carry a unit suffix (ms/us/s); normalise to microseconds.
          to_us() {
            case "$1" in
              *ms) awk -v x="${1%ms}" 'BEGIN{printf "%.2f", x*1000}';;
              *us) awk -v x="${1%us}" 'BEGIN{printf "%.2f", x}';;
              *s)  awk -v x="${1%s}"  'BEGIN{printf "%.2f", x*1000000}';;
              *)   echo "${1:-0}";;
            esac
          }

          echo "== E1 (V-2/V-28: 10k fibers x 1000 ms on one thread)"
          out=$(N=10000 MS=1000 $T ./target/release/ignis bench/php/e1_sleep_10k.php | tail -1)
          wall=$(sed -E 's/.*wall_ms=([0-9.]+).*/\1/' <<<"$out")
          record e1_wall_ms "${wall:-999999}" 1200

          echo "== E2 (V-4/V-28 addendum: all() of 3x200ms, warm per-fiber overhead)"
          out=$(N=10000 $T ./target/release/ignis bench/php/e2_all.php || true)
          all=$(sed -E 's/.*all3x200_ms=([0-9.]+).*/\1/' <<<"$out")
          warm=$(sed -E 's/.*per_fiber_us_warm=([0-9.]+).*/\1/' <<<"$out")
          record e2_all3x200_ms "${all:-999999}" 230
          record e2_per_fiber_us_warm "${warm:-999999}" 100


          echo "== hello (V-6/V-15: wrk -t2 -c64 -d10s, 1 PHP thread)"
          timeout 30 ./target/release/ignis examples/hello_server.php >/tmp/hello.log 2>&1 &
          HS=$!
          up=0
          for _ in $(seq 1 50); do curl -sf "http://$IGNIS_LISTEN/" 2>/dev/null | grep -q "Hello, World!" && { up=1; break; }; sleep 0.1; done
          rps=""
          if [ "$up" = 1 ]; then
            wrk_out=$(bench/wrk-hello.sh "http://$IGNIS_LISTEN/" 2 64 10s)
            rps=$(sed -nE 's/.*Requests\/sec:[[:space:]]*([0-9.]+).*/\1/p' <<<"$wrk_out")
          else
            echo "hello server never answered on $IGNIS_LISTEN"; cat /tmp/hello.log
          fi
          kill $HS 2>/dev/null; wait $HS 2>/dev/null || true
          baseline=$(grep -vE '^[[:space:]]*#' bench/results/nightly-baseline.txt 2>/dev/null | grep -oE '^[0-9.]+' | tail -1)
          if [ -z "${baseline:-}" ]; then
            line="nightly: hello_rps value=${rps:-NA} threshold=n/a (no baseline yet, seeding) PASS"
            echo "$line"; TABLE="${TABLE}${line}"$'\n'
          else
            thr=$(awk -v b="$baseline" 'BEGIN{printf "%.2f", b*0.5}')
            record hello_rps "${rps:-0}" "$thr" gt
          fi

          echo "== E16 (V-24: offload pool, 100 x 200ms through 8 workers)"
          # bench/e16-offload.sh's auto-routing leg also probes pdo_pgsql, which this runner
          # has no PostgreSQL for; run e16_offload.php directly to get the one summary line
          # the pool claim needs — it prints before that script's own (unguarded) pdo_pgsql probe.
          IGNIS_OFFLOAD_PRELUDE="$PWD/bench/php/e16_prelude.php" timeout 120 ./target/release/ignis --offload 8 bench/php/e16_offload.php >/tmp/e16.log 2>&1 || true
          e16_ms=$(sed -nE 's/^blocking calls: 100 x 200 ms through 8 workers: ([0-9.]+) ms wall.*/\1/p' /tmp/e16.log | tail -1)
          if [ -z "$e16_ms" ]; then
            echo "e16: no summary line (see log)"; cat /tmp/e16.log
            record e16_wall_ms 999999 3500
          else
            record e16_wall_ms "$e16_ms" 3500
          fi

          echo "== B1 p99 pair (V-37: budget must not move admitted-request p99 by > 25%)"
          B1ADDR=127.0.0.1:8097
          b1_start() {
            env IGNIS_LISTEN="$B1ADDR" "$@" timeout 30 ./target/release/ignis --threads 1 examples/hello_server.php >/tmp/b1-server.log 2>&1 &
            B1SRV=$!
            for _ in $(seq 1 60); do curl -sf "http://$B1ADDR/" 2>/dev/null | grep -q "Hello, World!" && return 0; sleep 0.1; done
            echo "b1 server did not start"; cat /tmp/b1-server.log; kill $B1SRV 2>/dev/null; return 1
          }
          b1_stop() { kill $B1SRV 2>/dev/null; wait $B1SRV 2>/dev/null; sleep 0.5; }
          p99_budget0=""; p99_budget512=""
          for pair in "budget0 IGNIS_FIBER_BUDGET=0" "budget512 IGNIS_FIBER_BUDGET=512"; do
            set -- $pair; label="$1"; cfg="$2"
            if b1_start "$cfg"; then
              wrk_line=$(wrk -t2 -c64 -d10s --latency "http://$B1ADDR/" 2>/dev/null | awk '/Requests\/sec/{r=$2} /99%/{p=$2} END{printf "rps=%s p99=%s", r, p}')
              b1_stop
              p99raw="${wrk_line##*p99=}"
              p99us=$(to_us "$p99raw")
              echo "b1 $label: $wrk_line -> p99_us=$p99us"
              [ "$label" = budget0 ] && p99_budget0="$p99us" || p99_budget512="$p99us"
            fi
          done
          if [ -n "$p99_budget0" ] && [ -n "$p99_budget512" ]; then
            thr=$(awk -v b="$p99_budget0" 'BEGIN{printf "%.2f", b*1.25}')
            record b1_p99_budget512_us "$p99_budget512" "$thr"
          else
            echo "nightly: b1_p99_budget512_us value=NA threshold=NA FAIL (server did not start on one or both arms)"
            TABLE="${TABLE}nightly: b1_p99_budget512_us value=NA threshold=NA FAIL"$'\n'
            FAILED=1
          fi

          echo "$TABLE" > /tmp/nightly-table.txt
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          {
            echo "table<<NIGHTLY_EOF"
            printf '%s\n' "$TABLE"
            echo "NIGHTLY_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: /tmp/nightly-table.txt

  report:
    name: report regressions
    needs: bench
    if: always() && needs.bench.outputs.failed == '1'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open or update the regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          TABLE: ${{ needs.bench.outputs.table }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          TITLE="nightly: regression $(date -u +%F)"
          BODY=$(printf 'Nightly perf gate (%s) found a regression.\n\n```\n%s\n```\n' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$TABLE")
          NUM=$(gh issue list --repo "$REPO" --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue edit "$NUM" --repo "$REPO" --body "$BODY"
            gh issue comment "$NUM" --repo "$REPO" --body "Updated: run ${{ github.run_id }} reproduced (or added to) the regression."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
