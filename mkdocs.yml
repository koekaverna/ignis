site_name: Ignis
site_description: An application server for PHP — fiber concurrency for unmodified synchronous code.
repo_url: https://github.com/koekaverna/ignis
repo_name: koekaverna/ignis
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Concept:
      - Why Ignis: concept/why.md
      - Architecture: concept/architecture.md
      - The three mechanisms: concept/mechanisms.md
      - What it is not: concept/non-goals.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Symfony: getting-started/symfony.md
      - Legacy apps: getting-started/legacy.md
      - Command-line scripts: getting-started/cli.md
  - Reference:
      - Configuration: reference/configuration.md
      - PHP API: reference/php-api.md
      - CLI: reference/cli.md
      - Classic mode: classic-mode.md
  - Operations: operate.md
  - Deploy: deploy.md
  - Migrate: migrate.md
  - Compatibility: compatibility.md
  - Comparison: comparison.md
  - Releasing: release.md
  - ADRs: adr/README.md
