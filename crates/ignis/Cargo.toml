[package]
name = "ignis"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Rust host embedding PHP 8.5 ZTS; PHP requests run on Fibers, I/O waits on tokio."

[dependencies]
ignis-sys = { path = "../ignis-sys" }
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util", "signal"] }
crossbeam-channel = "0.5"
mimalloc = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
anyhow = "1"
# E9 (ADR-0013): Temporal sdk-core behind a feature; git-only crates (the crates.io alpha is unrelated).
temporalio-sdk-core = { git = "https://github.com/temporalio/sdk-core", optional = true }
temporalio-client = { git = "https://github.com/temporalio/sdk-core", optional = true }
temporalio-protos = { git = "https://github.com/temporalio/sdk-core", optional = true, features = ["serde_serialize"] }
temporalio-common = { git = "https://github.com/temporalio/sdk-core", optional = true }
url = { version = "2", optional = true }
serde_json = "1"
futures = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
# M1: ignis.toml — the product config; env vars stay as overrides.
toml = "0.8"
base64 = "0.22"
prost-wkt-types = { version = "0.7", optional = true }

hyper = { version = "1", features = ["http1", "http2", "server"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
# E10 (ADR-0014): gRPC framing + client channel; no codegen, no prost.
tonic = { version = "0.14", default-features = false, features = ["server", "channel"] }
futures-core = "0.3"
# E6' (ADR-0017): TLS for hooked ssl:// streams; ring provider (no cmake/aws-lc build).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-pemfile = "2"
# E14 (ADR-0015): runtime-owned PostgreSQL pool; JSON boundary for params/rows.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[build-dependencies]
cc = "1"

[dev-dependencies]

[features]
# E18 (ADR-0020): interpose the blocking libc calls behind a fiber gate. Off by default until
# H32–H36 are green; the overhead bench (H35) compares a build with it against one without.
universal-park = []
temporal = ["dep:temporalio-sdk-core", "dep:temporalio-client", "dep:temporalio-protos", "dep:temporalio-common", "dep:url", "dep:futures", "dep:prost-wkt-types"]
