# nextest runs each test in its own process, and that is load-bearing rather than incidental here:
# http::REGISTRY and metrics::START are OnceLocks, and
# config::default_env mutates the process environment. Under `cargo test` those tests would share one
# process and fight; `cargo test` is therefore not a supported runner for this workspace (DECISIONS).
[profile.default]
# One run should name every failure; a partial list costs a whole CI cycle to learn the next one.
fail-fast = false
# A fiber or park test that hangs must name itself instead of dying inside CI's `timeout 900` with no
# output. The slowest test today is 0.045 s, so 10 s is ample headroom.
slow-timeout = { period = "10s", terminate-after = 6 }
final-status-level = "slow"
